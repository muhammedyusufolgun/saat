name: Android release build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate release signing secrets
        env:
          MASASAATI_KEYSTORE_BASE64: ${{ secrets.MASASAATI_KEYSTORE_BASE64 }}
          MASASAATI_KEYSTORE_PASSWORD: ${{ secrets.MASASAATI_KEYSTORE_PASSWORD }}
          MASASAATI_KEY_ALIAS: ${{ secrets.MASASAATI_KEY_ALIAS }}
          MASASAATI_KEY_PASSWORD: ${{ secrets.MASASAATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MASASAATI_KEYSTORE_BASE64 MASASAATI_KEYSTORE_PASSWORD MASASAATI_KEY_ALIAS MASASAATI_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing signing secret::$name is not set"
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/masa-saati-release.jks"
          if ! printf '%s' "$MASASAATI_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key_path"; then
            echo "::error title=Invalid keystore::MASASAATI_KEYSTORE_BASE64 is not valid Base64"
            exit 1
          fi
          if [ ! -s "$key_path" ]; then
            echo "::error title=Empty keystore::Decoded keystore file is empty"
            exit 1
          fi
          if ! keytool -list -keystore "$key_path" -storepass "$MASASAATI_KEYSTORE_PASSWORD" -alias "$MASASAATI_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Keystore validation failed::Check the keystore password, file, and key alias"
            exit 1
          fi

          {
            echo "MASASAATI_KEYSTORE_FILE=$key_path"
            echo "MASASAATI_KEYSTORE_PASSWORD=$MASASAATI_KEYSTORE_PASSWORD"
            echo "MASASAATI_KEY_ALIAS=$MASASAATI_KEY_ALIAS"
            echo "MASASAATI_KEY_PASSWORD=$MASASAATI_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Name and verify APK
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path"
          cp "$apk_path" app/build/outputs/saat.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/saat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saat-apk
          path: app/build/outputs/saat.apk
          if-no-files-found: error
          retention-days: 14
