name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare signing
        env:
          MASASAATI_KEYSTORE_BASE64: ${{ secrets.MASASAATI_KEYSTORE_BASE64 }}
          MASASAATI_KEYSTORE_PASSWORD: ${{ secrets.MASASAATI_KEYSTORE_PASSWORD }}
          MASASAATI_KEY_ALIAS: ${{ secrets.MASASAATI_KEY_ALIAS }}
          MASASAATI_KEY_PASSWORD: ${{ secrets.MASASAATI_KEY_PASSWORD }}
        run: |
          if [ -n "$MASASAATI_KEYSTORE_BASE64" ]; then
            for name in MASASAATI_KEYSTORE_PASSWORD MASASAATI_KEY_ALIAS MASASAATI_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "Missing required signing secret: $name"
                exit 1
              fi
            done
            key_path="$RUNNER_TEMP/masa-saati-release.jks"
            printf '%s' "$MASASAATI_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            test -s "$key_path"
            echo "MASASAATI_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"
            echo "MASASAATI_KEYSTORE_PASSWORD=$MASASAATI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MASASAATI_KEY_ALIAS=$MASASAATI_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MASASAATI_KEY_PASSWORD=$MASASAATI_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          if [ "$BUILD_VARIANT" = "release" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi

      - name: Name and verify APK
        run: |
          if [ "$BUILD_VARIANT" = "release" ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/saat.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/saat.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/saat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saat-apk
          path: app/build/outputs/saat.apk
