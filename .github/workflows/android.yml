name: Android release build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Upload APK for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: saat-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify release certificate and APK contents
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs download/saat.apk | tee "$RUNNER_TEMP/signer.txt"
          grep -Fq 'certificate SHA-256 digest: 83e5378ff7f77120b5e6a28be68a58f60dfc01fb20238c971b2ffd630213fdcd' "$RUNNER_TEMP/signer.txt"
          python3 - <<'PY'
          import re
          from zipfile import ZipFile
          def payload(path):
              with ZipFile(path) as apk:
                  files = {}
                  for name in apk.namelist():
                      if re.fullmatch(r'META-INF/(MANIFEST\.MF|[^/]+\.(?:RSA|SF))', name):
                          continue
                      if name in files:
                          raise ValueError(f'Duplicate APK entry: {name}')
                      data = apk.read(name)
                      if name == 'META-INF/version-control-info.textproto':
                          data = re.sub(rb'(?<=revision: ")[0-9a-f]{40}(?=")', b'COMMIT', data)
                      files[name] = data
                  return files
          if payload('download/saat.apk') != payload('app/build/outputs/apk/release/app-release-unsigned.apk'):
              raise SystemExit('The signed APK differs from this build. Sign the new unsigned artifact.')
          PY

      - name: Upload verified release
        uses: actions/upload-artifact@v4
        with:
          name: saat-apk
          path: download/saat.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install download/saat.apk
            adb shell am start -W -n tr.com.olgun.masasaati/.MainActivity | grep -F 'Status: ok'
            adb shell pidof tr.com.olgun.masasaati
